name: Record the presentation video

# Builds the whole Sprint 2 video on a GitHub runner: the slides (threadpilot/demo/slides, held for the seconds in
# their speaker notes) followed by the demo recorded against the deployed site (threadpilot/demo/demo_timeline.json),
# and uploads presentation.mp4 + presentation.srt. Nobody has to install Node, Playwright or ffmpeg locally.
# Run it from the Actions tab ("Run workflow").
# Needs one repository secret: THREADPILOT_ACCESS_KEY (Settings → Secrets and variables → Actions). The key is read
# from the secret into the recorder's environment only; it is never printed or stored in the artifact.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "live = record the deployed site (needs the secret and the deploy); offline = replay server on the runner (real engine and UI, scripted planner, no model, nothing sent)"
        type: choice
        options: [offline, live]
        default: offline
      site_url:
        description: The deployed site to record (live mode)
        default: https://threadpilot-dss5105-track1-i7gxvcy5k7ef5ac9b.webapps.tcloudbase.com
        required: true
      dry_run:
        description: Live mode only - leave out the steps that act for real (sending the chase-up, confirming the watch)
        type: boolean
        default: true
      compress_waits:
        description: Speed-up factor for the model's thinking time in the cut (1 = keep real time)
        default: "8"
        required: true
      timeline:
        description: Timeline file (relative to threadpilot/)
        default: demo/demo_timeline.json
        required: true
      include_demo:
        description: Record the demo and append it to the slides (off = slides only, no secret needed)
        type: boolean
        default: true
      burn_slide_captions:
        description: Burn the slide narration into a caption band on the slides (off = clean slides under the recorded voice-over in demo/voice; the .srt is still produced)
        type: boolean
        default: false

jobs:
  record:
    name: Record and cut
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright, Chromium and ffmpeg
        working-directory: threadpilot
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core poppler-utils > /dev/null
      - name: Render the slides
        working-directory: threadpilot
        run: node demo/render_slides.cjs --slides demo/slides --out dist/slides
      - name: Start the offline replay server
        if: ${{ inputs.include_demo && inputs.mode == 'offline' }}
        working-directory: threadpilot
        run: |
          python -m pip install -q uv
          (cd backend && uv sync --locked --group dev)
          nohup backend/.venv/bin/python demo/replay_server.py 8765 > replay.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/v1/health > /dev/null && break; sleep 1; done
          cat replay.log
      - name: Check the site is reachable and runs the current build
        if: ${{ inputs.include_demo && inputs.mode == 'live' }}
        run: |
          code=$(curl -s -o /tmp/index.html -w "%{http_code}" "${{ inputs.site_url }}/")
          echo "site HTTP $code"
          if grep -q "20261026-home" /tmp/index.html; then echo "::notice title=build::the site serves the 26 Oct frontend (home screen present)";
          else echo "::warning title=build::the site does not serve the 26 Oct frontend yet; the home-screen steps will be skipped or fail"; fi
      - name: Record the demo
        if: ${{ inputs.include_demo }}
        working-directory: threadpilot
        env:
          THREADPILOT_DEMO_URL: ${{ inputs.mode == 'live' && inputs.site_url || 'http://127.0.0.1:8765' }}
          THREADPILOT_ACCESS_KEY: ${{ inputs.mode == 'live' && secrets.THREADPILOT_ACCESS_KEY || '' }}
        run: |
          if [ "${{ inputs.mode }}" = "live" ] && [ -z "$THREADPILOT_ACCESS_KEY" ]; then echo "::error title=secret::THREADPILOT_ACCESS_KEY is not set in the repository secrets"; exit 1; fi
          # offline: nothing is sent, so the confirm steps stay in; live: dry_run decides
          node demo/record_demo.cjs --timeline "${{ inputs.timeline }}" --out dist/demo --compress-waits "${{ inputs.compress_waits }}" ${{ inputs.mode == 'live' && inputs.dry_run && '--dry-run' || '' }}
      - name: Assemble the presentation
        if: always()
        working-directory: threadpilot
        run: node demo/assemble_video.cjs --slides dist/slides --demo dist/demo --out dist/presentation ${{ inputs.burn_slide_captions && '--burn' || '' }} ${{ inputs.include_demo && '' || '--no-demo' }}
      - name: Summary
        if: always()
        working-directory: threadpilot
        run: |
          { echo "### Presentation video"; echo; echo '```'; ls -la dist/presentation dist/demo 2>/dev/null || echo "no output"; echo; python3 -c "import json;d=json.load(open('dist/demo/run_log.json'));print(f\"demo recorded {d['total_s']:.1f} s, drift {d['drift_s']:.1f} s\");[print('step',s['step'],'at',s['at'],'error:',s['error'][:160]) for s in d['steps'] if 'error' in s]" 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the video, the slides, the captions and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-video
          path: |
            threadpilot/dist/presentation/presentation.mp4
            threadpilot/dist/presentation/presentation.srt
            threadpilot/dist/presentation/slides.mp4
            threadpilot/dist/presentation/slides.srt
            threadpilot/dist/slides/*.png
            threadpilot/dist/demo/demo_final.mp4
            threadpilot/dist/demo/demo_cut.mp4
            threadpilot/dist/demo/demo_cut.srt
            threadpilot/dist/demo/demo.srt
            threadpilot/dist/demo/run_log.json
            threadpilot/dist/demo/failed-step-*.png
          if-no-files-found: warn
          retention-days: 14
