[project]
name = "threadpilot-backend"
version = "1.0.0"
description = "ThreadPilot FastAPI and OpenAI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.uv]
package = false
