<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="Calibri, Arial, sans-serif">
<title>False alarms per month against detection of a 20% drop lasting 3 days, for six rules</title>
<rect width="720" height="420" fill="#FFFFFF"/>
<line x1="70" x2="690" y1="360.0" y2="360.0" stroke="#D5DEE0" stroke-width="1"/>
<text x="62" y="364.0" text-anchor="end" font-size="12" fill="#5E6E7A">50%</text>
<line x1="70" x2="690" y1="296.0" y2="296.0" stroke="#D5DEE0" stroke-width="1"/>
<text x="62" y="300.0" text-anchor="end" font-size="12" fill="#5E6E7A">60%</text>
<line x1="70" x2="690" y1="232.0" y2="232.0" stroke="#D5DEE0" stroke-width="1"/>
<text x="62" y="236.0" text-anchor="end" font-size="12" fill="#5E6E7A">70%</text>
<line x1="70" x2="690" y1="168.0" y2="168.0" stroke="#D5DEE0" stroke-width="1"/>
<text x="62" y="172.0" text-anchor="end" font-size="12" fill="#5E6E7A">80%</text>
<line x1="70" x2="690" y1="104.0" y2="104.0" stroke="#D5DEE0" stroke-width="1"/>
<text x="62" y="108.0" text-anchor="end" font-size="12" fill="#5E6E7A">90%</text>
<line x1="70" x2="690" y1="40.0" y2="40.0" stroke="#D5DEE0" stroke-width="1"/>
<text x="62" y="44.0" text-anchor="end" font-size="12" fill="#5E6E7A">100%</text>
<text x="70.0" y="378" text-anchor="middle" font-size="12" fill="#5E6E7A">0</text>
<text x="158.6" y="378" text-anchor="middle" font-size="12" fill="#5E6E7A">2</text>
<text x="247.1" y="378" text-anchor="middle" font-size="12" fill="#5E6E7A">4</text>
<text x="335.7" y="378" text-anchor="middle" font-size="12" fill="#5E6E7A">6</text>
<text x="424.3" y="378" text-anchor="middle" font-size="12" fill="#5E6E7A">8</text>
<text x="512.9" y="378" text-anchor="middle" font-size="12" fill="#5E6E7A">10</text>
<text x="601.4" y="378" text-anchor="middle" font-size="12" fill="#5E6E7A">12</text>
<text x="690.0" y="378" text-anchor="middle" font-size="12" fill="#5E6E7A">14</text>
<text x="380.0" y="406" text-anchor="middle" font-size="13" fill="#16262B">False alarms per month, whole factory (fewer is better)</text>
<text x="18" y="200.0" text-anchor="middle" font-size="13" fill="#16262B" transform="rotate(-90 18 200.0)">20% drop for 3 days: detected</text>
<circle cx="583.7" cy="40.0" r="5" fill="#2E6F77" stroke="#FFFFFF" stroke-width="2"><title>Current band (1.5 SD, 5% floor): 11.6 false alarms a month, 100% detected</title></circle>
<text x="575.7" y="28.0" text-anchor="end" font-size="12" fill="#16262B">Current band (1.5 SD, 5% floor)</text>
<circle cx="105.4" cy="200.0" r="5" fill="#2E6F77" stroke="#FFFFFF" stroke-width="2"><title>Shewhart 3-sigma: 0.8 false alarms a month, 75% detected</title></circle>
<text x="115.4" y="216.0" text-anchor="start" font-size="12" fill="#16262B">Shewhart 3-sigma</text>
<circle cx="207.3" cy="65.6" r="5" fill="#2E6F77" stroke="#FFFFFF" stroke-width="2"><title>Western Electric rules: 3.1 false alarms a month, 96% detected</title></circle>
<text x="217.3" y="69.6" text-anchor="start" font-size="12" fill="#16262B">Western Electric rules</text>
<circle cx="92.1" cy="168.0" r="5" fill="#2E6F77" stroke="#FFFFFF" stroke-width="2"><title>EWMA (0.2, 3-sigma): 0.5 false alarms a month, 80% detected</title></circle>
<text x="102.1" y="172.0" text-anchor="start" font-size="12" fill="#16262B">EWMA (0.2, 3-sigma)</text>
<circle cx="127.6" cy="46.4" r="5" fill="#2E6F77" stroke="#FFFFFF" stroke-width="2"><title>CUSUM (k 0.5, h 4): 1.3 false alarms a month, 99% detected</title></circle>
<text x="123.6" y="68.4" text-anchor="middle" font-size="12" fill="#16262B">CUSUM (k 0.5, h 4)</text>
<circle cx="149.7" cy="40.0" r="7" fill="#D9532B" stroke="#FFFFFF" stroke-width="2"><title>3-sigma + CUSUM (shipped): 1.8 false alarms a month, 100% detected</title></circle>
<text x="161.7" y="28.0" text-anchor="start" font-size="12" fill="#16262B" font-weight="bold">3-sigma + CUSUM (shipped)</text>
</svg>
